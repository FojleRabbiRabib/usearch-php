name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        os: [ubuntu-24.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ valgrind clang-format-14

      - name: Fetch and verify pinned USearch source
        run: ./tools/fetch-usearch.sh

      - name: Build and assert hardening
        run: ./tools/build.sh ${{ matrix.php }}

      - name: Symbol isolation gate
        run: ./tools/gate-symbols.sh modules/usearch.so

      - name: Run phpt test suite
        run: php tools/test-phpt.php

      - name: Metric-correctness gate
        run: php -n -d extension=modules/usearch.so tests/quality/metrics.php

      - name: Run Valgrind memory churn test
        run: |
          valgrind --leak-check=full --error-exitcode=1 \
            php -n -d extension=modules/usearch.so tests/memory/churn.php

      - name: Fetch and verify Fashion-MNIST (MIT)
        run: ./tools/fetch-dataset.sh

      - name: Recall@10 quality gate
        run: php -n -d extension=modules/usearch.so tests/quality/recall.php

  quality:
    name: Code style and static analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
          composer install --no-interaction --prefer-dist

      - name: C/C++ formatting gate
        run: |
          clang-format-14 --dry-run --Werror \
            php_usearch.h usearch_internal.h usearch_bridge.h \
            usearch.c usearch_index.c usearch_vector.c usearch_enums.c usearch_exception.c \
            usearch_bridge.cpp

      - name: Arginfo drift gate
        run: |
          php tools/gen_stub.php usearch.stub.php
          git diff --exit-code usearch_arginfo.h

      - name: PHP linting
        run: |
          find . -name "*.php" -not -path "*/vendor/*" -not -path "*/tools/PHP-Parser*/*" -exec php -l {} \;

      - name: PHP_CodeSniffer
        run: vendor/bin/phpcs

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress
