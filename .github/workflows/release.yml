name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build PHP ${{ matrix.php }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.4'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.5'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.3'
            arch: aarch64
            os: ubuntu-22.04-arm
          - php: '8.4'
            arch: aarch64
            os: ubuntu-22.04-arm
          - php: '8.5'
            arch: aarch64
            os: ubuntu-22.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ zip

      - name: Build, gate, and package PHP ${{ matrix.php }}
        env:
          ABIS: ${{ matrix.php }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: tools/release-build.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-php${{ matrix.php }}-${{ matrix.arch }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 3

  build-musl:
    name: Build PHP ${{ matrix.php }} musl (x86_64)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The Alpine environment runs through an explicit docker step rather than
      # a job-level container: checkout and artifact upload must stay on the
      # host, where the node-based actions run.
      - name: Build, gate, and package PHP ${{ matrix.php }} (musl)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker run --rm -e GIT_REV="$GITHUB_SHA" -e RELEASE_TAG="$RELEASE_TAG" \
            -v "$PWD":/src -w /src "php:${{ matrix.php }}-alpine" sh -c '
            set -eu
            apk add --no-cache bash g++ make autoconf zip
            ABIS=${{ matrix.php }} LIBC=musl tools/release-build.sh
          '

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-php${{ matrix.php }}-musl-x86_64
          path: build/dist/*
          if-no-files-found: error
          retention-days: 3

  finalize:
    name: Assemble and publish release
    needs: [build, build-musl]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    env:
      SYFT_VERSION: '1.52.0'
      SYFT_SHA256: 'caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d'
      COSIGN_VERSION: '3.1.3'
      COSIGN_SHA256: '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: build/dist

      - name: Verify tag provenance, version lockstep, and rolled changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          base="${tag#v}"
          ext_version="$(awk -F'"' '/#define PHP_USEARCH_VERSION/ {print $2}' php_usearch.h)"
          if [ "$base" != "$ext_version" ]; then
            echo "FAIL: tag $tag base version '$base' != PHP_USEARCH_VERSION '$ext_version'" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "FAIL: tag $tag is not on main" >&2
            exit 1
          fi
          if ! grep -qE "^## $base( |$|-)" CHANGELOG.md; then
            echo "FAIL: CHANGELOG.md has no '## $base' section; roll [Unreleased] first" >&2
            exit 1
          fi
          printf 'RELEASE_BASE=%s\n' "$base" >> "$GITHUB_ENV"

      - name: Generate the SBOM (syft, pinned)
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$SYFT_SHA256" "$archive" | sha256sum -c -
          tar xzf "$archive" -C "$RUNNER_TEMP" syft
          "$RUNNER_TEMP/syft" dir:build/dist --source-name usearch-php --source-version "$RELEASE_BASE" -o spdx-json > /tmp/sbom.spdx.json
          mv /tmp/sbom.spdx.json "build/dist/usearch-php-${RELEASE_BASE}-sbom.spdx.json"

      - name: Regenerate SHA256SUMS over all assets
        shell: bash
        run: |
          set -euo pipefail
          cd build/dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print | sort | xargs sha256sum > /tmp/usv-release-sums.tmp
          mv /tmp/usv-release-sums.tmp SHA256SUMS

      - name: Install cosign (pinned)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          printf '%s  %s\n' "$COSIGN_SHA256" "$RUNNER_TEMP/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cosign"

      - name: Sign every release asset (cosign keyless)
        shell: bash
        run: |
          set -euo pipefail
          cd build/dist
          for f in *; do
            [ -f "$f" ] || continue
            [ "$f" = "SHA256SUMS" ] && continue
            "$RUNNER_TEMP/cosign" sign-blob --yes --bundle "$f.bundle" "$f"
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "usearch-php $GITHUB_REF_NAME" \
            --notes "Static per-ABI builds of the usearch extension for PHP 8.3, 8.4, and 8.5 (glibc and musl, x86_64 and arm64). See CHANGELOG.md for this release's changes; verify assets with SHA256SUMS and the cosign bundles." \
            build/dist/*
